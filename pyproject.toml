[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-diff"
version = "0.2.0"
description = "Semantic diff engine with structural comparison and change classification"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0"]

[project.scripts]
sigma-diff = "sigma_diff.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
