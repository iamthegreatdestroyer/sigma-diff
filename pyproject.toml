[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-diff"
version = "0.1.0"
description = "Semantic diff engine with structural comparison and change classification"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
